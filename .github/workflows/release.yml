name: Build release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Choose the DFHack version to build against
        id: dfhack
        env:
          # EDIT THIS LINE: it must be exactly the version `dfhack-version` prints in your game.
          DFHACK_VERSION: "53.17-r1"
        run: echo "tag=$DFHACK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-11 g++-11 libxml-libxslt-perl zip

      - name: Check out DFHack
        env:
          DFHACK_TAG: ${{ steps.dfhack.outputs.tag }}
        run: git clone --depth 1 --branch "$DFHACK_TAG" --recurse-submodules https://github.com/DFHack/dfhack.git dfhack

      - name: Add the plugin to DFHack
        run: |
          mkdir -p dfhack/plugins/external/smooth-movement-adv
          cp CMakeLists.txt smooth-movement.cpp test_visual_animation_manager.cpp visual_animation.h dfhack/plugins/external/smooth-movement-adv/

      - name: Build Linux plugin
        run: |
          cmake -S dfhack -B dfhack/build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF
          cmake --build dfhack/build/linux --target smooth-movement-adv 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect diagnostics (only runs if the build failed)
        if: failure()
        run: |
          mkdir -p diag
          grep -n "error" build.log | head -60 > diag/first-errors.txt || true
          for f in graphic_viewportst.h global_objects.h viewport_spatter_flag.h; do
            find dfhack -name "$f" -exec cp {} diag/ \; || true
          done
          find dfhack -name "df.graphic.xml" -exec cp {} diag/ \; || true
          cp dfhack/plugins/external/smooth-movement-adv/smooth-movement.cpp diag/ || true
          cp -r dfhack/plugins/smooth-movement diag/builtin-smooth-movement || true
          echo "=== first errors ==="; cat diag/first-errors.txt
          ls -la diag

      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diag/

      - name: Build Windows plugin
        run: |
          # An unrelated DFHack plugin (logistics) can fail to link on the runner; only our DLL matters.
          (cd dfhack/build && ./build-win64-from-linux.sh) || echo "full build reported errors; checking for our DLL"
          dll=$(find dfhack/build -name smooth-movement-adv.plug.dll | head -1)
          test -n "$dll" || { echo "our DLL was not built"; exit 1; }
          echo "found $dll"

      - name: Package plugins
        env:
          DFHACK_TAG: ${{ steps.dfhack.outputs.tag }}
        run: |
          release_tag="$GITHUB_REF_NAME-dfhack-$DFHACK_TAG"
          mkdir -p release/linux/hack/plugins release/windows/hack/plugins
          install -m755 dfhack/build/linux/plugins/external/smooth-movement-adv/smooth-movement-adv.plug.so release/linux/hack/plugins/
          install -m755 "$(find dfhack/build -name smooth-movement-adv.plug.dll | head -1)" release/windows/hack/plugins/
          (cd release/linux && zip -q -r "../smooth-movement-$release_tag-linux-x86_64.zip" hack)
          (cd release/windows && zip -q -r "../smooth-movement-$release_tag-windows-x86_64.zip" hack)
          for archive in release/*.zip; do unzip -t "$archive"; done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
